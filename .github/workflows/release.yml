name: Publish update release
# Retain the current update and at least two previous published updates.
# No cleanup or replacement step: older releases, tags and assets remain available.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build tagged application
        run: python tools/build.py --version "${GITHUB_REF_NAME#v}"
      - run: python tools/check.py
      - run: python tools/package.py
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            options+=(--prerelease)
          fi
          # Upload while draft; publishing can then make the complete assets immutable.
          # A failed run leaves its draft for review. Never replace or reuse a release tag.
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --draft \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${options[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
